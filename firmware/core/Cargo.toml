[package]
name         = "nxcontroller-core"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.88"
description  = "Chip-independent nxcontroller firmware: control protocol, USB HID, BLE, TCP, settings, logging"

# A library for the board crates next to it (esp32s3/, pico/). Each board picks
# the features it supports and builds it with its own toolchain and target.

[dependencies]
critical-section  = "1.2.0"
embassy-executor  = "0.10.0"
embassy-futures   = "0.1.2"
embassy-sync      = "0.8.0"
embassy-time      = "0.5.1"
embassy-usb       = { version = "0.6", default-features = false }
embedded-io-async = "0.7.0"
embedded-storage  = "0.3.1"
log               = "0.4.27"
# Atomics everywhere: the RP2040 (Cortex-M0+) has no compare-and-swap.
portable-atomic   = { version = "1.11", default-features = false, features = ["critical-section"] }
static_cell       = "2.1.1"

# --- Bluetooth LE transport (feature `ble`) ---
# `security` = LE Secure Connections pairing. trouble-host 0.7.0 fails to compile
# `security` without `central`, so keep the defaults.
bt-hci       = { version = "0.9", optional = true }
trouble-host = { version = "0.7.0", optional = true, features = ["gatt", "log", "security"] }

# --- WiFi transport (feature `wifi`): TCP control, UDP discovery, setup hotspot ---
embassy-net = { version = "0.9.1", optional = true, features = ["dhcpv4", "log", "medium-ethernet", "tcp", "udp"] }

[features]
ble  = ["dep:trouble-host", "dep:bt-hci"]
wifi = ["dep:embassy-net"]
