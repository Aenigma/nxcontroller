[package]
edition      = "2024"
name         = "nxcontroller-firmware"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "nxcontroller-firmware"
path = "./src/main.rs"

[dependencies]
nxcontroller-core = { path = "../core" }
esp-hal = { version = "~1.2.2", features = ["esp32s3", "log-04", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }
# Flash writes (saved settings) must run with interrupts off: while the flash is
# busy, any interrupt handler that lives in flash would freeze the chip.
# esp-bootloader-esp-idf pulls esp-storage in with default features disabled.
esp-storage = { version = "0.10.0", features = ["esp32s3", "critical-section"] }
log                    = "0.4.27"

embassy-net = { version = "0.9.1", optional = true, features = [
  "dhcpv4",
  "log",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.20.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.18.0", features = ["esp32s3", "log-04"] }
# for more networking protocol support see https://crates.io/crates/edge-net
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-radio = { version = "1.0.0-beta.1", features = [
  "esp-alloc",
  "esp32s3",
  "log-04",
  "unstable",
] }
smoltcp = { version = "0.14.0", optional = true, default-features = false, features = [
  "log",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
embassy-usb = { version = "0.6", default-features = false }
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"

[features]
# Source builds get both transports. The web page's firmware is `--no-default-features
# --features ble` (no WiFi, so no setup hotspot and no unauthenticated TCP port).
default = ["ble", "wifi", "coex"]
# Control over Bluetooth LE (GATT): the browser page uses it.
ble = ["nxcontroller-core/ble", "esp-radio/ble"]
# Control over WiFi (TCP, UDP discovery, setup hotspot): the Python package uses it.
wifi = ["nxcontroller-core/wifi", "esp-radio/wifi", "dep:embassy-net", "dep:smoltcp"]
# Lets WiFi and BLE share the one radio. Required when both are enabled.
coex = ["esp-radio/coex"]


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'

