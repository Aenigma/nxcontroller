# Builds the firmware and the web page (installer + remote), publishes the page
# to GitHub Pages from the default branch, and attaches the firmware to releases
# for v* tags.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # mise runs this repository's tasks without asking to trust mise.toml.
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  ELF: firmware/esp32s3/target/xtensa-esp32s3-none-elf/release/nxcontroller-firmware

jobs:
  # Every job runs the same mise tasks as you do locally (`mise tasks` lists them);
  # mise-action installs the tools pinned in mise.toml.

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run test:python

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run test:web

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run setup:esp32s3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # espup downloads from GitHub
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            firmware/esp32s3
            firmware
      - run: mise run lint

  # Each firmware the page offers builds in a job of its own (Bluetooth only).

  build-esp32s3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run setup:esp32s3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # espup downloads from GitHub
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/esp32s3
      - run: mise run web:esp32s3
      - name: Merged image for releases (one file for any flasher, at offset 0x0)
        run: |
          mkdir -p release
          espflash save-image --chip esp32s3 --merge "$ELF" release/nxcontroller-esp32s3-merged.bin
      - uses: actions/upload-artifact@v7
        with:
          name: esp32s3
          path: |
            web/public/manifest.json
            web/public/firmware/
            release/

  build-pico:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chip: [rp2040, rp2350]  # Pico W, Pico 2 W
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware
          key: ${{ matrix.chip }}
      - run: mise run build:pico:${{ matrix.chip }}
      - uses: actions/upload-artifact@v7
        with:
          name: pico-${{ matrix.chip }}
          path: firmware/pico/dist/*.uf2

  # The page around every board's firmware; also the set of files for releases.
  site:
    needs: [build-esp32s3, build-pico]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: actions/download-artifact@v8
        with:
          name: esp32s3
          path: .
      - uses: actions/download-artifact@v8
        with:
          pattern: pico-*
          merge-multiple: true
          path: web/public/firmware/
      - run: mise run web:page
      - name: Collect the firmware for releases
        run: |
          mkdir -p dist
          cp web/public/firmware/* release/* dist/
      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: dist/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist/

  pages:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [python, web, lint, site]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python, web, lint, site]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: dist/
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
