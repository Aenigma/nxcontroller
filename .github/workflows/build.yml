# Builds the firmware and the web page (installer + remote), publishes the page
# to GitHub Pages from the default branch, and attaches the firmware to releases
# for v* tags.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Xtensa Rust toolchain installed by espup (rust-toolchain.toml selects "esp").
  ESP_RUST_VERSION: "1.97.0.0"
  ELF: firmware/esp32s3/target/xtensa-esp32s3-none-elf/release/nxcontroller-firmware

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # this action publishes no moving major tag
      - name: Test
        working-directory: python
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Typecheck and test
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install espup and espflash
        uses: taiki-e/install-action@v2
        with:
          tool: espup,espflash

      - name: Install the Xtensa Rust toolchain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: espup install --targets esp32s3 --toolchain-version "$ESP_RUST_VERSION" --export-file "$HOME/export-esp.sh"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            firmware/esp32s3
            firmware/pico
            firmware/core

      # Pico W / Pico 2 W and the shared core build with stable Rust; their
      # rust-toolchain.toml adds the two Arm targets.
      - name: Lint the core and the Pico firmware
        run: |
          rustup target add thumbv6m-none-eabi thumbv8m.main-none-eabihf
          for features in ble wifi ble,wifi; do
            (cd firmware/core && cargo clippy --release --features "$features" --target thumbv6m-none-eabi -- -D warnings)
          done
          cd firmware/pico
          cargo clippy --release --features rp2040 --target thumbv6m-none-eabi -- -D warnings
          cargo clippy --release --features rp2350 --target thumbv8m.main-none-eabihf -- -D warnings

      - name: Lint the ESP32-S3 firmware (ble + wifi, ble only, wifi only)
        working-directory: firmware/esp32s3
        run: |
          . "$HOME/export-esp.sh"
          cargo clippy --release -- -D warnings
          cargo clippy --release --no-default-features --features ble -- -D warnings
          cargo clippy --release --no-default-features --features wifi -- -D warnings

      # pnpm's version comes from "packageManager" in web/package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build the web page and its firmware (all boards, Bluetooth only)
        run: |
          . "$HOME/export-esp.sh"
          scripts/web.sh

      - name: Collect firmware images
        run: |
          mkdir -p dist
          cp web/public/firmware/bootloader.bin web/public/firmware/partitions.bin web/public/firmware/app.bin dist/
          cp web/public/firmware/*.uf2 dist/
          # One image for any flasher: write it at offset 0x0.
          espflash save-image --chip esp32s3 --merge "$ELF" dist/nxcontroller-esp32s3-merged.bin

      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: dist/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist/

  pages:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [python, web, firmware]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python, web, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: dist/
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
